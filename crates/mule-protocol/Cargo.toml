[package]
name = "mule-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Deterministic eD2K wire protocol codec, framing and abstractions for Emule-Sion"

[features]
default = []
lab-loopback = []
ed2k-loopback = ["dep:tokio", "dep:serde_json"]
ed2k-reference-loopback = ["ed2k-loopback"]

[dependencies]
bytes.workspace = true
thiserror.workspace = true
hex.workspace = true
tracing.workspace = true
tokio = { workspace = true, optional = true, features = ["net", "io-util", "time", "sync", "rt"] }
unicode-normalization.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
md4.workspace = true
md-5.workspace = true
num-bigint.workspace = true
rand.workspace = true
flate2.workspace = true


[dev-dependencies]
mule-core = { path = "../mule-core" }
mule-format = { path = "../mule-format" }
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
md4.workspace = true
proptest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[[test]]
name = "lab_state_machine"
required-features = ["lab-loopback"]

[[test]]
name = "lab_in_flight_and_blocks"
required-features = ["lab-loopback"]

[[test]]
name = "loopback_transfer"
required-features = ["lab-loopback"]

[[test]]
name = "lab_adversarial"
required-features = ["lab-loopback"]

[[test]]
name = "in_flight_properties"
required-features = ["lab-loopback"]

[[test]]
name = "ed2k_session_tests"
required-features = ["ed2k-loopback"]

[[test]]
name = "ed2k_file_status_tests"
required-features = ["ed2k-loopback"]

[[test]]
name = "ed2k_reference_interop_tests"
required-features = ["ed2k-reference-loopback"]

[[test]]
name = "tier3_loopback"
required-features = ["ed2k-reference-loopback"]

[[test]]
name = "ed2k_block_transfer_tests"
required-features = ["ed2k-loopback"]

[[test]]
name = "ed2k_part_resume_tests"
required-features = ["ed2k-loopback"]


