[package]
name = "mule-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Deterministic eD2K wire protocol codec, framing and abstractions for Emule-Sion"

[features]
default = []
lab-loopback = []

[dependencies]
bytes.workspace = true
thiserror.workspace = true
hex.workspace = true
tracing.workspace = true

[dev-dependencies]
mule-core = { path = "../mule-core" }
mule-format = { path = "../mule-format" }
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
proptest.workspace = true

[[test]]
name = "lab_state_machine"
required-features = ["lab-loopback"]

[[test]]
name = "lab_in_flight_and_blocks"
required-features = ["lab-loopback"]

[[test]]
name = "loopback_transfer"
required-features = ["lab-loopback"]

[[test]]
name = "lab_adversarial"
required-features = ["lab-loopback"]

[[test]]
name = "in_flight_properties"
required-features = ["lab-loopback"]

