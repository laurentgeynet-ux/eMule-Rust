[package]
name = "mule-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Local daemon and JSON-RPC WebSocket API for emule-modern"

[features]
default = []
debug-rpc = []
lab-loopback = ["mule-protocol/lab-loopback"]
ed2k-loopback = ["mule-protocol/ed2k-loopback"]
lab-tools = ["lab-loopback", "ed2k-loopback", "debug-rpc"]
ed2k-reference-loopback = ["ed2k-loopback", "mule-protocol/ed2k-reference-loopback"]


[dependencies]
mule-core = { path = "../mule-core" }
mule-format = { path = "../mule-format" }
mule-protocol = { path = "../mule-protocol" }
mule-network-policy = { path = "../mule-network-policy" }
mule-filter = { path = "../mule-filter" }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
futures-util.workspace = true
hex.workspace = true
rand.workspace = true
fs4 = "1.1.0"
bytes.workspace = true
md4.workspace = true
data-encoding.workspace = true
igd-next.workspace = true
reqwest.workspace = true
flate2.workspace = true
time.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
tempfile.workspace = true

[[test]]
name = "inter_daemon_transfer"
required-features = ["lab-loopback"]

[[test]]
name = "daemon_adversarial"
required-features = ["lab-loopback"]

[[test]]
name = "ed2k_source_discovery"
required-features = ["ed2k-loopback"]

[[test]]
name = "ed2k_transfer_tests"
required-features = ["ed2k-loopback"]

[[test]]
name = "lab_rpc_tests"
required-features = ["lab-tools"]


