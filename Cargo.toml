[workspace]
resolver = "2"
members = [
    "crates/mule-crypto",
    "crates/mule-format",
    "crates/mule-core",
    "crates/mule-daemon",
    "crates/mule-cli",
    "crates/mule-protocol",
    "crates/mule-network-policy",
    "crates/mule-filter",
    "crates/mule-mcp",
]

[workspace.package]
version = "0.2.0-RC1"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["EMule-Rust Contributors"]

[workspace.dependencies]
bytes = "1"
thiserror = "2"
md4 = "0.10"
md-5 = "0.10"
num-bigint = "0.4"
sha1 = "0.10"
data-encoding = "2"
url = "2"
percent-encoding = "2"
clap = { version = "4", features = ["derive"] }
proptest = "1"
hex = "0.4"
rand = "0.9"
rusqlite = { version = "0.33", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "local-time"] }
futures-util = "0.3"
tokio-tungstenite = "0.26"
unicode-normalization = "0.1"
igd-next = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
flate2 = "1.0"
time = { version = "0.3", features = ["formatting", "local-offset"] }
