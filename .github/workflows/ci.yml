name: CI

on:
  push:
    branches: [master, Dev, Beta]
  pull_request:
    branches: [master, Dev, Beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (check / clippy / test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test (100% hors-ligne)
        run: cargo test --workspace --all-features

      - name: cargo deny (licences & advisories)
        run: |
          cargo install cargo-deny --locked
          cargo deny check
        continue-on-error: true

  flutter:
    name: Flutter (analyze / test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get (workspace packages + apps)
        shell: pwsh
        run: |
          foreach ($dir in @('packages/mule_client', 'packages/ui_kit', 'packages/app_shell', 'apps/desktop', 'apps/web')) {
            Push-Location $dir
            flutter pub get
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }

      - name: flutter analyze (desktop)
        working-directory: apps/desktop
        run: flutter analyze

      - name: flutter test (desktop)
        working-directory: apps/desktop
        run: flutter test
